spring.application.name=CampusConnect

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/campusconnect
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
campusconnect.demo-password-reset.enabled=true
campusconnect.demo-password-reset.key=CampusConnectLocalDemo2026